name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  verifier:
    name: Types, tests, build et parcours navigateur
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # PostgreSQL : migrations Supabase et file de tâches de l'auto-candidature testées sur une vraie base
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      AUTOMATION_PG: -h localhost -p 5432 -U postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Dépendances
        run: npm ci

      - name: Vérification des types
        run: npm run lint

      - name: Tests unitaires
        run: npm test

      - name: Build (interface + serveur)
        run: npm run build

      - name: Navigateur pour les tests de bout en bout
        run: npx playwright install --with-deps chromium

      - name: Tests de bout en bout (sources simulées)
        run: npm run test:e2e

      - name: Auto-candidature de bout en bout (worker réel, PostgreSQL, Gmail simulé)
        run: npm run test:e2e:worker

      - name: Candidature automatique dans le navigateur (interface + worker réels)
        run: npm run test:e2e:automation
