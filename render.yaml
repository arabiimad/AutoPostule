# Déploiement Render (région Francfort) : service web + worker permanent d'auto-candidature.
# Les secrets (sync: false) se saisissent dans le tableau de bord Render, jamais dans Git.
# Base de données et stockage : Supabase (UE). Migrations : supabase/migrations (001 à 006) à appliquer avant.
services:
  - type: web
    name: kareer-web
    runtime: docker
    region: frankfurt
    plan: starter
    healthCheckPath: /api/health
    envVars:
      - { key: NODE_ENV, value: production }
      - { key: PUBLIC_URL, sync: false }
      - { key: SUPABASE_URL, sync: false }
      - { key: SUPABASE_ANON_KEY, sync: false }
      - { key: SUPABASE_SERVICE_ROLE_KEY, sync: false }
      - { key: GEMINI_API_KEY, sync: false }
      - { key: AUTOMATION_DATABASE_URL, sync: false }
      - { key: AUTOMATION_TOKEN_KEY, sync: false }
      - { key: GOOGLE_CLIENT_ID, sync: false }
      - { key: GOOGLE_CLIENT_SECRET, sync: false }
      - { key: MICROSOFT_CLIENT_ID, sync: false }
      - { key: MICROSOFT_CLIENT_SECRET, sync: false }
      - { key: AUTOMATION_MAX_DAILY, value: "5" }
      - { key: VAPID_PUBLIC_KEY, sync: false }

  - type: worker
    name: kareer-worker
    runtime: docker
    region: frankfurt
    plan: starter
    dockerCommand: node build/server/worker.cjs
    envVars:
      - { key: NODE_ENV, value: production }
      - { key: AUTOMATION_DATABASE_URL, sync: false }
      - { key: AUTOMATION_TOKEN_KEY, sync: false }
      - { key: GEMINI_API_KEY, sync: false }
      - { key: GOOGLE_CLIENT_ID, sync: false }
      - { key: GOOGLE_CLIENT_SECRET, sync: false }
      - { key: MICROSOFT_CLIENT_ID, sync: false }
      - { key: MICROSOFT_CLIENT_SECRET, sync: false }
      - { key: LBA_API_KEY, sync: false }
      - { key: FT_CLIENT_ID, sync: false }
      - { key: FT_CLIENT_SECRET, sync: false }
      - { key: JSEARCH_API_KEY, sync: false }
      - { key: ADZUNA_APP_ID, sync: false }
      - { key: ADZUNA_APP_KEY, sync: false }
      - { key: JOOBLE_API_KEY, sync: false }
      - { key: VAPID_PUBLIC_KEY, sync: false }
      - { key: VAPID_PRIVATE_KEY, sync: false }
      - { key: VAPID_SUBJECT, sync: false }
      - { key: AUTOMATION_SEARCH_EVERY_HOURS, value: "12" }
      - { key: AUTOMATION_CONCURRENCY, value: "1" }
