<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#ffffff" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/kareer-logo.png" />
    <script>
      // Thème appliqué avant l'affichage (évite un flash blanc en mode sombre)
      (function () {
        try {
          var pref = localStorage.getItem('autopostule_theme');
          var dark = pref === 'dark' || (pref !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (dark) document.documentElement.classList.add('dark');
        } catch (e) {}
      })();
    </script>
    <title>Kareer — Offres, CV sur mesure et suivi de candidatures</title>
    <meta name="description" content="Trouvez des offres réelles (France Travail, La bonne alternance, LinkedIn, Indeed…), générez un CV LaTeX et une lettre adaptés, et suivez vos candidatures." />
    <meta property="og:title" content="Kareer — Offres, CV sur mesure et suivi de candidatures" />
    <meta property="og:site_name" content="Kareer" />
    <meta property="og:description" content="Trouvez des offres réelles, générez un CV LaTeX et une lettre adaptés, et suivez vos candidatures." />
    <meta property="og:type" content="website" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  </head>
  <body>
    <!-- Écran de démarrage Kareer (animation de kareer.pro), remplacé par l'application dès son chargement -->
    <style>
      #boot { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; background: #f5f8fc; font-family: Inter, system-ui, sans-serif; }
      html.dark #boot { background: #0a0f1e; }
      #boot .b-logo { position: relative; width: 112px; height: 112px; display: flex; align-items: center; justify-content: center; }
      #boot svg { width: 92px; height: 92px; overflow: visible; filter: drop-shadow(0 0 20px rgba(21,101,192,.5)); animation: b-breathe 2.5s ease-in-out 1.6s infinite; }
      #boot .b-bg { opacity: 0; transform-origin: 64px 64px; animation: b-bg .7s cubic-bezier(.16,1,.3,1) .1s forwards; }
      #boot .b-up { opacity: 0; transform-origin: 60px 40px; animation: b-up .7s cubic-bezier(.16,1,.3,1) .4s forwards; }
      #boot .b-low { opacity: 0; transform-origin: 55px 85px; animation: b-low .6s cubic-bezier(.16,1,.3,1) .75s forwards; }
      #boot .b-ring { position: absolute; top: 50%; left: 50%; width: 104px; height: 104px; transform: translate(-50%,-50%); border-radius: 24px; border: 2px solid rgba(21,101,192,.25); animation: b-ring 2.5s ease-in-out 1s infinite; }
      #boot .b-name { font-size: 28px; font-weight: 800; letter-spacing: -1px; color: #0f172a; opacity: 0; animation: b-text .8s ease .3s forwards; }
      html.dark #boot .b-name { color: #f8fafc; }
      #boot .b-tag { margin-top: -12px; font-size: 13px; font-weight: 500; color: #64748b; opacity: 0; animation: b-text .8s ease .6s forwards; }
      html.dark #boot .b-tag { color: #94a3b8; }
      #boot .b-bar { width: 200px; height: 4px; border-radius: 4px; overflow: hidden; background: rgba(100,116,139,.18); }
      #boot .b-fill { height: 100%; width: 0; border-radius: 4px; background: linear-gradient(90deg,#1565C0,#00BCD4,#1E88E5); background-size: 200% 100%; animation: b-fill 2s ease-in-out infinite, b-grad 1s linear infinite; }
      @keyframes b-breathe { 50% { filter: drop-shadow(0 0 35px rgba(21,101,192,.8)); } }
      @keyframes b-bg { 0% { opacity: 0; transform: scale(.6) rotate(-5deg); } 60% { opacity: 1; transform: scale(1.04) rotate(1deg); } 100% { opacity: 1; transform: none; } }
      @keyframes b-up { 0% { opacity: 0; transform: translate(-12px,8px) scale(.85); } 50% { opacity: 1; } 100% { opacity: 1; transform: none; } }
      @keyframes b-low { 0% { opacity: 0; transform: translate(-8px,12px) scale(.85); } 50% { opacity: 1; } 100% { opacity: 1; transform: none; } }
      @keyframes b-ring { 50% { transform: translate(-50%,-50%) scale(1.1); border-color: rgba(21,101,192,.5); box-shadow: 0 0 30px rgba(21,101,192,.15); } }
      @keyframes b-text { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
      @keyframes b-fill { 0% { width: 0; } 40% { width: 60%; } 70% { width: 85%; } 100% { width: 100%; } }
      @keyframes b-grad { to { background-position: 200% 0; } }
      @media (prefers-reduced-motion: reduce) { #boot * { animation: none !important; opacity: 1 !important; } #boot .b-fill { width: 60%; } }
    </style>
    <div id="root"><div id="boot" role="status" aria-label="Chargement de Kareer">
      <div class="b-logo">
        <svg viewBox="0 0 128 128" aria-hidden="true"><rect class="b-bg" x="4" y="4" width="120" height="120" rx="24" fill="#1565C0"/><path class="b-up" d="M98 22L68 21L67 23L71 29L41 50L38 49L38 23L24 23L23 75L77 41L83 48Z" fill="#fff"/><path class="b-low" d="M23 83L24 97L60 74L85 106L103 106L65 56Z" fill="#fff"/></svg>
        <div class="b-ring"></div>
      </div>
      <span class="b-name">Kareer</span>
      <span class="b-tag">Passez votre carrière au niveau supérieur</span>
      <div class="b-bar"><div class="b-fill"></div></div>
    </div></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
