<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#ffffff" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <script>
      // Thème appliqué avant l'affichage (évite un flash blanc en mode sombre)
      (function () {
        try {
          var pref = localStorage.getItem('autopostule_theme');
          var dark = pref === 'dark' || (pref !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (dark) document.documentElement.classList.add('dark');
        } catch (e) {}
      })();
    </script>
    <title>AutoPostule — Offres, CV sur mesure et suivi de candidatures</title>
    <meta name="description" content="Trouvez des offres réelles (France Travail, La bonne alternance, LinkedIn, Indeed…), générez un CV LaTeX et une lettre adaptés, et suivez vos candidatures." />
    <meta property="og:title" content="AutoPostule — Offres, CV sur mesure et suivi de candidatures" />
    <meta property="og:description" content="Trouvez des offres réelles, générez un CV LaTeX et une lettre adaptés, et suivez vos candidatures." />
    <meta property="og:type" content="website" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
